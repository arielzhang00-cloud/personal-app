<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <h1>Life Hub</h1>
  <span id="sync-status" class="sync-status" title="Sync status">offline-ready</span>
</header>

<main class="page">
  <nav class="tiles" id="tiles"></nav>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
  const ICONS = {
    dailies: '<path d="M4 6h16M4 12h16M4 18h10"/><path d="M19 15l2 2 3-3" transform="translate(-4 1)"/>',
    nutrition: '<path d="M12 21c-4 0-7-3.5-7-8 0-3 2-5 4.5-5 1.2 0 2 .5 2.5 1 .5-.5 1.3-1 2.5-1C17 8 19 10 19 13c0 4.5-3 8-7 8z"/><path d="M12 8V4M12 4c2 0 3-1 3-2"/>',
    exercise: '<path d="M4 12h2M18 12h2"/><rect x="6" y="8" width="3" height="8" rx="1"/><rect x="15" y="8" width="3" height="8" rx="1"/><path d="M9 12h6"/>',
    events: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    budgeting: '<path d="M3 7h18v12H3z"/><circle cx="12" cy="13" r="2.5"/><path d="M6 3h12"/>',
    gifts: '<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12"/><path d="M12 9S9 3 7 5s5 4 5 4 3-6 5-4-5 4-5 4z"/>',
    focus: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
    whimsy: '<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M19 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>'
  };
  const SECTIONS = [
    ['dailies', 'Dailies'],
    ['nutrition', 'Nutrition'],
    ['exercise', 'Exercise'],
    ['events', 'Events'],
    ['budgeting', 'Budgeting'],
    ['gifts', 'Gifts'],
    ['focus', 'Focus'],
    ['whimsy', 'Whimsy'],
  ];
  document.getElementById('tiles').innerHTML = SECTIONS.map(
    ([slug, label]) =>
      `<a class="tile" href="${slug}.html">` +
      `<svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[slug]}</svg>` +
      `<span class="tile-label">${label}</span></a>`
  ).join('');
</script>
</body>
</html>
