<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <h1>Life Hub</h1>
  <span id="sync-status" class="sync-status" title="Sync status">offline-ready</span>
</header>

<main class="page">
  <nav class="tiles" id="tiles"></nav>
</main>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
  const SECTIONS = [
    ['dailies', 'Dailies', '☑'],
    ['nutrition', 'Nutrition', '🥗'],
    ['exercise', 'Exercise', '🏃'],
    ['events', 'Events', '📅'],
    ['budgeting', 'Budgeting', '💰'],
    ['gifts', 'Gifts', '🎁'],
    ['focus', 'Focus', '🎯'],
    ['whimsy', 'Whimsy', '✨'],
  ];
  document.getElementById('tiles').innerHTML = SECTIONS.map(
    ([slug, label, icon]) =>
      `<a class="tile" href="${slug}.html"><span class="tile-icon">${icon}</span><span class="tile-label">${label}</span></a>`
  ).join('');
</script>
</body>
</html>
