<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Nutrition · Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="back-link" href="index.html">‹ Home</a>
  <h1>Nutrition</h1>
  <span id="sync-status" class="sync-status">offline-ready</span>
</header>

<main class="page">
  <section class="card">
    <div class="row">
      <label class="field grow">Day
        <input type="date" id="day">
      </label>
      <label class="field grow">Weight (lb)
        <input type="number" id="weight" step="0.1" inputmode="decimal" placeholder="—">
      </label>
    </div>
  </section>

  <section class="card">
    <div class="totals">
      <div class="total"><div class="value" id="t-cal">0</div><div class="label">Calories</div></div>
      <div class="total"><div class="value" id="t-pro">0</div><div class="label">Protein (g)</div></div>
      <div class="total"><div class="value" id="t-fib">0</div><div class="label">Fiber (g)</div></div>
      <div class="total"><div class="value" id="t-wt">—</div><div class="label">Weight (lb)</div></div>
    </div>
  </section>

  <section class="card">
    <div class="saved-line">
      <div class="grow">
        <input list="saved-list" id="saved-picker" placeholder="Type or scroll to find a saved item…" autocomplete="off">
        <datalist id="saved-list"></datalist>
      </div>
      <button id="btn-saved" class="primary">Saved items</button>
    </div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table id="food-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity (g)</th>
            <th>Quantity (ct)</th>
            <th>Calories</th>
            <th>Protein</th>
            <th>Fiber</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="food-body"></tbody>
        <tfoot>
          <tr>
            <td data-label="Total">Total</td>
            <td data-label="Quantity (g)"></td>
            <td data-label="Quantity (ct)"></td>
            <td data-label="Calories" id="f-cal">0</td>
            <td data-label="Protein" id="f-pro">0</td>
            <td data-label="Fiber" id="f-fib">0</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-add-row">+ Add row</button>
    </div>
  </section>

  <section class="card">
    <div class="chart-head">
      <h2>Weight</h2>
      <div class="ranges" id="ranges">
        <button data-range="7" aria-pressed="true">Last week</button>
        <button data-range="30" aria-pressed="false">Last month</button>
        <button data-range="90" aria-pressed="false">3 months</button>
        <button data-range="365" aria-pressed="false">Last year</button>
      </div>
    </div>
    <canvas id="weight-chart"></canvas>
    <div class="hint" id="chart-hint"></div>
  </section>

  <section class="card">
    <div class="chart-head">
      <h2>Body measurements</h2>
      <div class="ranges" id="m-ranges">
        <button data-range="7" aria-pressed="true">Last week</button>
        <button data-range="30" aria-pressed="false">Last month</button>
        <button data-range="90" aria-pressed="false">3 months</button>
        <button data-range="365" aria-pressed="false">Last year</button>
      </div>
    </div>
    <div class="measure-grid" id="measure-inputs"></div>
    <canvas id="measure-chart"></canvas>
    <div class="chart-legend" id="measure-legend"></div>
    <div class="hint" id="measure-hint"></div>
  </section>
</main>

<!-- Add-from-saved / edit-saved-item popup -->
<dialog id="dlg-item">
  <form method="dialog">
    <div class="modal-head" id="dlg-item-title">Add item</div>
    <div class="modal-body">
      <div class="section-title">Item details (saved for next time)</div>
      <div class="form-grid">
        <label class="field">Name<input id="i-name"></label>
        <label class="field">Serving basis
          <select id="i-basis">
            <option value="g">Per grams</option>
            <option value="ct">Per count</option>
          </select>
        </label>
        <label class="field">Serving size<input id="i-serving" type="number" step="0.01" inputmode="decimal" value="100"></label>
        <label class="field">Calories / serving<input id="i-cal" type="number" step="0.01" inputmode="decimal" value="0"></label>
        <label class="field">Protein (g) / serving<input id="i-pro" type="number" step="0.01" inputmode="decimal" value="0"></label>
        <label class="field">Fiber (g) / serving<input id="i-fib" type="number" step="0.01" inputmode="decimal" value="0"></label>
      </div>

      <div class="section-title">Add to today</div>
      <div class="form-grid">
        <label class="field">Quantity (g)<input id="a-g" type="number" step="0.01" inputmode="decimal" placeholder="—"></label>
        <label class="field">Quantity (ct)<input id="a-ct" type="number" step="0.01" inputmode="decimal" placeholder="—"></label>
      </div>
      <div class="hint" id="a-preview"></div>
    </div>
    <div class="modal-foot">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="save" id="i-save" class="ghost">Save details only</button>
      <button value="add" id="i-add" class="primary">Save &amp; add to day</button>
    </div>
  </form>
</dialog>

<!-- Saved items manager popup -->
<dialog id="dlg-saved">
  <div class="modal-head">Saved items</div>
  <div class="modal-body">
    <div class="section-title">New saved item</div>
    <div class="form-grid">
      <label class="field">Name<input id="s-name" placeholder="e.g. Greek yogurt"></label>
      <label class="field">Serving basis
        <select id="s-basis">
          <option value="g">Per grams</option>
          <option value="ct">Per count</option>
        </select>
      </label>
      <label class="field">Serving size<input id="s-serving" type="number" step="0.01" inputmode="decimal" value="100"></label>
      <label class="field">Calories / serving<input id="s-cal" type="number" step="0.01" inputmode="decimal" value="0"></label>
      <label class="field">Protein (g) / serving<input id="s-pro" type="number" step="0.01" inputmode="decimal" value="0"></label>
      <label class="field">Fiber (g) / serving<input id="s-fib" type="number" step="0.01" inputmode="decimal" value="0"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="s-add" class="primary">Save item</button>
    </div>

    <div class="section-title">All saved items</div>
    <div id="s-list"></div>
  </div>
  <div class="modal-foot">
    <button id="s-close" class="ghost">Close</button>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/nutrition.js"></script>
</body>
</html>
