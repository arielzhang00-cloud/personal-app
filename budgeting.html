<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Budgeting · Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="back-link" href="index.html">‹ Home</a>
  <h1>Budgeting</h1>
  <span id="sync-status" class="sync-status">offline-ready</span>
</header>

<main class="page">
  <section class="card">
    <div class="row">
      <label class="field grow">Date
        <input type="date" id="day">
      </label>
      <div class="field grow">View
        <div class="ranges" id="views">
          <button data-view="day" aria-pressed="false">Daily</button>
          <button data-view="week" aria-pressed="false">Weekly</button>
          <button data-view="month" aria-pressed="true">Monthly</button>
          <button data-view="year" aria-pressed="false">Yearly</button>
        </div>
      </div>
    </div>
    <div class="hint" id="range-label"></div>
  </section>

  <section class="card">
    <div class="totals">
      <div class="total"><div class="value" id="t-spend">$0</div><div class="label">Spent</div></div>
      <div class="total"><div class="value" id="t-reimb">$0</div><div class="label">Reimbursed</div></div>
      <div class="total"><div class="value" id="t-items">0</div><div class="label">Items</div></div>
    </div>
    <div class="stackbar" id="stackbar"></div>
    <div class="stack-legend" id="legend"></div>
  </section>

  <section class="card">
    <div class="saved-line">
      <div class="grow">
        <input list="quick-list" id="quick-picker" placeholder="Type or scroll to find a saved item…" autocomplete="off">
        <datalist id="quick-list"></datalist>
      </div>
      <button id="btn-quick" class="primary">Saved items</button>
    </div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table id="spend-table">
        <thead>
          <tr>
            <th class="col-date">Date</th>
            <th>Item</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Reimbursed</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="spend-body"></tbody>
        <tfoot>
          <tr>
            <td class="col-date"></td>
            <td data-label="Total">Total</td>
            <td data-label="Category"></td>
            <td data-label="Price"></td>
            <td data-label="Quantity" id="f-qty">0</td>
            <td data-label="Total" id="f-total">$0</td>
            <td data-label="Reimbursed"></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-add-row">+ Add row</button>
    </div>
  </section>
</main>

<!-- Quick-add / edit saved spending item -->
<dialog id="dlg-item">
  <form method="dialog">
    <div class="modal-head" id="dlg-item-title">Add item</div>
    <div class="modal-body">
      <div class="section-title">Item details (saved for next time)</div>
      <div class="form-grid">
        <label class="field">Name<input id="i-name"></label>
        <label class="field">Category
          <input id="i-cat" list="cat-list" placeholder="e.g. Transit">
          <datalist id="cat-list"></datalist>
        </label>
        <label class="field">Price each<input id="i-price" type="number" step="0.01" inputmode="decimal" value="0"></label>
      </div>

      <div class="section-title">Add to this date</div>
      <div class="form-grid">
        <label class="field">Quantity<input id="a-qty" type="number" step="1" inputmode="numeric" value="1"></label>
        <label class="field check-field"><input id="a-reimb" type="checkbox"> Reimbursed</label>
      </div>
      <div class="hint" id="a-preview"></div>
    </div>
    <div class="modal-foot">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="save" class="ghost">Save details only</button>
      <button value="add" class="primary">Save &amp; add</button>
    </div>
  </form>
</dialog>

<!-- Saved items manager -->
<dialog id="dlg-saved">
  <div class="modal-head">Saved items</div>
  <div class="modal-body">
    <div class="section-title">New saved item</div>
    <div class="form-grid">
      <label class="field">Name<input id="s-name" placeholder="e.g. Metro fare"></label>
      <label class="field">Category<input id="s-cat" list="cat-list" placeholder="e.g. Transit"></label>
      <label class="field">Price each<input id="s-price" type="number" step="0.01" inputmode="decimal" value="0"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="s-add" class="primary">Save item</button>
    </div>

    <div class="section-title">All saved items</div>
    <div id="s-list"></div>
  </div>
  <div class="modal-foot">
    <button id="s-close" class="ghost">Close</button>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/budgeting.js"></script>
</body>
</html>
