<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Dailies · Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="back-link" href="index.html">‹ Home</a>
  <h1>Dailies</h1>
  <span id="sync-status" class="sync-status">offline-ready</span>
</header>

<main class="page">
  <section class="card">
    <div class="row">
      <label class="field grow">Day
        <input type="date" id="day">
      </label>
      <div class="total grow">
        <div class="value" id="t-done">0 / 0</div>
        <div class="label">Done today</div>
      </div>
    </div>
    <div class="hint" id="range-label"></div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table id="daily-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Done</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-add-row" class="primary">+ Add daily</button>
    </div>
    <div class="hint">Checkboxes are per day — everything starts unchecked again tomorrow.</div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/dailies.js"></script>
</body>
</html>
