<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Exercise · Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="back-link" href="index.html">‹ Home</a>
  <h1>Exercise</h1>
  <span id="sync-status" class="sync-status">offline-ready</span>
</header>

<main class="page">
  <section class="card">
    <div class="row">
      <label class="field grow">Workout
        <select id="workout-picker"></select>
      </label>
      <label class="field grow">Name
        <input type="text" id="workout-name" placeholder="Workout name">
      </label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-new-workout" class="primary">+ New workout</button>
      <button id="btn-delete-workout" class="danger">Delete workout</button>
    </div>
  </section>

  <section class="card">
    <div class="totals">
      <div class="total"><div class="value" id="t-exercises">0</div><div class="label">Exercises</div></div>
      <div class="total"><div class="value" id="t-sets">0</div><div class="label">Sets</div></div>
      <div class="total"><div class="value" id="t-volume">0</div><div class="label">Volume (wt × sets × reps)</div></div>
    </div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table id="exercise-table">
        <thead>
          <tr>
            <th>Exercise</th>
            <th>Weight</th>
            <th>Sets</th>
            <th>Reps</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="exercise-body"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-add-row" class="primary">+ Add exercise</button>
    </div>
    <div class="hint">Each workout keeps its own list of exercises.</div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/exercise.js"></script>
</body>
</html>
